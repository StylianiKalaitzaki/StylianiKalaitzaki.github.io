<!DOCTYPE html>
<html>
    <head>
        <style>
            :root {
                --color-bg: #ffffff;
                --color-text: #000000;
                --font-mono: "JetBrains Mono", "Cascadia Code", "Fira Code", monospace;
            }
            .cursor {
                animation: blink 1s step-end infinite;
            }
            @keyframes blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0; }
            }
            body {
                background-color: var(--color-bg);
                font-family: var(--font-mono);
                background: radial-gradient(circle, #f6f6f6 0%, #000000 100%);
                background-attachment: fixed;
                background-repeat: no-repeat;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #terminal {
                display: flex;
                flex-direction: column;
                text-align: left;
                width: 30ch;
                height: 7lh;
                gap: 0.05rem;
                border-style: dashed;
                padding: 1rem 1rem;
            }
            #terminal p {
                margin: 7px 0;
            }
            #hero {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }
            nav {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            nav a {
                font-family: var(--font-mono);
                color: var(--color-text);
                text-decoration: none;
                position: relative;
            }
            nav a::before {
                content: '[';
                opacity: 0;
                transition: opacity 0.2s ease;
            }
            nav a::after {
                content: ']';
                opacity: 0;
                transition: opacity 0.2s ease;
            }
            nav a:hover::before,
            nav a:hover::after {
                opacity: 1;
            }
            #overlay {
                position: fixed;
                inset: 0;
                background: #000;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #fff;
                font-family: var(--font-mono);
                font-size: 1.5rem;
                z-index: 9999;
                transition: opacity 0.8s ease;
                background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            }
            #overlay p {
                animation: blink normal 3s infinite ease-in-out;
            }
        </style>
    </head>

    <body>
        <div id="overlay">
            <p>Press F for flashlight</p>
        </div>

        <section id="hero"></section>
        <section id="about"></section>
        <section id="skills"></section>
        <section id="projects"></section>
        <section id="xp"></section>
        <section id="contact"></section>

        <footer>
        </footer>

        <script src="data.js"></script>
        <script src="main.js"></script>
    </body>
</html>
